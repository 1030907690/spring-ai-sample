spring:
  application:
    name: spring-ai-sample
  ai:
    openai:
      # 百炼 API Key，仅从环境变量注入，不设默认值：未配置时首次调用即失败，便于排查
      api-key: ${BAILIAN_API_KEY}
      # OpenAI 兼容模式 base-url，环境变量可覆盖，默认百炼兼容端点
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.8-flash
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
    mcp:
      server:
        protocol: STATELESS
        name: mcp-sample
        version: 1.0.0
        type: SYNC
        instructions: "提供天气查询等工具"
        streamable-http:
          mcp-endpoint: /api/mcp

server:
  port: 8080

# 日志配置
logging:
  level:
    com.zzq: debug

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  # 分组配置
  group-configs:
    - group: "index"
      paths-to-match: "/api/index/**"
    - group: "user"
      paths-to-match: "/api/user/**"

knife4j:
  # 增强
  enable: true
  basic:
    enable: false
    username: zzq
    password: zzq
  setting:
    language: zh_cn
    enable-footer-custom: true
    footer-custom-content: zzq
    swagger-model-name: 实体类列表
    enable-group: true
    enable-search: true






